on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.channel }}
        target: ${{ matrix.target }}
        override: true
        components: rustfmt
    - name: Install 32-bit MinGW linker
      if: matrix.target == 'i686-pc-windows-gnu'
      uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: MSYS
        update: true
        install: mingw-w64-i686-gcc
    - name: Add 32-bit MinGW to PATH
      if: matrix.target == 'i686-pc-windows-gnu'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'mingw32\bin')
    - uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: --all -- --check
    - env:
        CHANNEL: ${{ matrix.channel }}
        CROSS: ${{ !startsWith(matrix.target, 'x86_64') && contains(matrix.target, 'linux') && '1' || '0' }}
        TARGET: ${{ matrix.target }}
        NO_RUN: ${{ matrix.no_run }}
      run: sh ci/run.sh

    strategy:
      fail-fast: false
      matrix:
        target: [
          x86_64-unknown-linux-gnu,
          i686-unknown-linux-gnu,
          aarch64-unknown-linux-gnu,
          armv7-unknown-linux-gnueabihf,
          thumbv7neon-unknown-linux-gnueabihf,
          x86_64-apple-darwin,
          aarch64-apple-darwin,
          x86_64-pc-windows-gnu,
          x86_64-pc-windows-msvc,
          riscv64gc-unknown-linux-gnu,
          i686-pc-windows-gnu,
          i686-pc-windows-msvc,
          loongarch64-unknown-linux-gnu,
          powerpc64le-unknown-linux-gnu,
        ]
        channel: [stable, nightly]
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: i686-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-latest
        - target: armv7-unknown-linux-gnueabihf
          os: ubuntu-latest
        - target: thumbv7neon-unknown-linux-gnueabihf
          os: ubuntu-latest
        # The cross-rs image for riscv uses GCC 7.5 which has issues with unwinding
        - target: riscv64gc-unknown-linux-gnu
          os: ubuntu-latest
          no_run: 1
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-26
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: x86_64-pc-windows-gnu
          os: windows-latest
        - target: riscv64gc-unknown-linux-gnu
          os: ubuntu-latest
        - target: i686-pc-windows-msvc
          os: windows-latest
        - target: i686-pc-windows-gnu
          os: windows-latest
        - target: loongarch64-unknown-linux-gnu
          os: ubuntu-latest
        - target: powerpc64le-unknown-linux-gnu
          os: ubuntu-latest
        exclude:
        # PowerPC inline asm is still unstable
        - target: powerpc64le-unknown-linux-gnu
          channel: stable

  # Xtensa needs the esp-rs toolchain. Tests run under Espressif's QEMU, which
  # has no ESP32-S2 machine, so the ESP32-S2 is only built.
  xtensa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32s2, esp32s3]
        profile: [dev, release]
    env:
      TARGET: xtensa-${{ matrix.chip }}-none-elf
      OUT: target/xtensa-${{ matrix.chip }}-none-elf/${{ matrix.profile == 'dev' && 'debug' || 'release' }}
      ESPFLASH_SKIP_UPDATE_CHECK: "true"
    steps:
    - uses: actions/checkout@v4
    # The released esp-hal and xtensa-lx-rt crates don't support esp-rs 1.99 and
    # later (esp-rs/rust#287), so the tests run on 1.98, and corosensei itself is
    # built with the latest toolchain afterwards.
    - uses: esp-rs/xtensa-toolchain@v1.7
      with:
        buildtargets: ${{ matrix.chip }}
        version: 1.98.1.0
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install espflash and QEMU
      run: |
        sudo apt-get update && sudo apt-get install -y libpixman-1-0 libsdl2-2.0-0 libslirp0 libgcrypt20
        curl -sSfLo /tmp/espflash.zip https://github.com/esp-rs/espflash/releases/download/v4.7.0/espflash-x86_64-unknown-linux-gnu.zip
        unzip /tmp/espflash.zip -d ~/.cargo/bin
        curl -sSfL https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz | tar -xJ -C ~
        echo ~/qemu/bin >> $GITHUB_PATH
    - name: Test
      working-directory: ci/xtensa
      run: |
        cargo +esp build --target $TARGET --profile ${{ matrix.profile }} --features ${{ matrix.chip }}
        if [ ${{ matrix.chip }} != esp32s2 ]; then
          espflash save-image --chip ${{ matrix.chip }} --merge --flash-size 4mb $OUT/corosensei-xtensa-tests flash.bin
          timeout 900 qemu-system-xtensa -nographic -semihosting -machine ${{ matrix.chip }} -drive file=flash.bin,if=mtd,format=raw
        fi
    - uses: esp-rs/xtensa-toolchain@v1.7
      with:
        buildtargets: ${{ matrix.chip }}
        version: 1.100.0.0
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build with the latest toolchain
      run: cargo +esp build -Zbuild-std=core --target $TARGET --profile ${{ matrix.profile }} --no-default-features
    - name: Build for ESP-IDF (std)
      if: matrix.chip == 'esp32s3'
      run: cargo +esp build -Zbuild-std=std,panic_abort --target xtensa-esp32s3-espidf --profile ${{ matrix.profile }} --no-default-features --features unwind
